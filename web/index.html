<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spectrum</title>
<style>
  @font-face {
    font-family: "FSPxKayahD70";
    src: url("/static/fonts/FSPxKayahD70-Regular.ttf") format("truetype");
    font-display: swap;
  }
  @font-face {
    /* Most system/browser default monospace fonts don't actually include
       glyphs for the Braille Patterns block (U+2800-28FF) and fall back to
       a generic "missing glyph" box, which is why the sparklines looked
       like solid squares instead of dots. Subset of Noto Sans Symbols 2,
       braille block only (~2KB), bundled so rendering is guaranteed
       regardless of what's installed on the viewing device. */
    font-family: "BrailleSymbols";
    src: url("/static/fonts/BrailleSymbols-Regular.woff2") format("woff2");
    font-display: swap;
  }
  @font-face {
    /* DSEG7 Classic (SIL OFL, https://github.com/keshikan/DSEG), subset to
       just the glyphs it actually has: digits, space, ! - . : and ° --
       notably no %, no /, no comma. Applied only to the digit runs inside
       a value (via the digitize() helper), never to unit suffixes or
       labels, since those characters would just be missing. */
    font-family: "DSEG7Classic";
    src: url("/static/fonts/DSEG7Classic-Bold.woff2") format("woff2");
    font-display: swap;
  }
  :root {
    --bg: #0b0f14;
    --panel: #10161d;
    --border: #223040;
    --text: #d7e2ec;
    --muted: #5b7186;
    --accent: #37e8b0;
    --grid: #1c2733;
    --grid-mid: #263241;
  }
  * { box-sizing: border-box; }
  html, body {
    min-height: 100%;
    /* safety net for the responsive rules below -- nothing should overflow
       once they're in place, but this keeps a stray fixed-width element
       from dragging the whole page into horizontal scroll if one does */
    overflow-x: hidden;
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0.12) 0px,
      rgba(0, 0, 0, 0.12) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    z-index: 999;
  }
  body {
    margin: 0;
    background-color: var(--bg);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px;
    color: var(--text);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    /* same as the gap between blocks (#system-wrap's grid-gap / sys-side's
       flex gap), so the outer margin reads as "one more slot" instead of
       a wider band -- also buys back the width the clock/weather and CPU
       temp text need to not clip their panel edge at 600px (the kiosk's
       portrait width). */
    padding: 12px;
  }
  .header-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  h1 {
    font-family: "FSPxKayahD70", ui-monospace, monospace;
    font-size: 28px;
    font-weight: 400;
    letter-spacing: 0.06em;
    color: #33ff66;
    text-shadow:
      0 0 2px #33ff66,
      0 0 6px rgba(51, 255, 102, 0.7),
      0 0 16px rgba(51, 255, 102, 0.4);
    margin: 0;
  }
  #status {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  #status.connected { background: #37e8b0; box-shadow: 0 0 6px #37e8b0; }
  #status.disconnected { background: #ff5470; box-shadow: 0 0 6px #ff5470; }
  #header-signal {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .header-rssi-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  #header-rssi {
    font-size: 11px;
    color: var(--muted);
  }
  #scope-wrap {
    position: relative;
    max-width: 820px;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
  }
  #empty {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 12px;
  }

  /* --- system monitor panels (btop-ish) ------------------------------- */
  #system-wrap {
    max-width: 820px;
    margin-top: 0;
    display: grid;
    /* minmax(0, Nfr), not bare Nfr: an frtrack's default min size is its
       content's min-content width, so whichever row has the widest
       column-1 content (the clock row, now that it doesn't span) can
       force col1 wider than its 2fr share and squeeze col2 -- same bug
       as sys-row2 and cpu-gauge-row already had to work around. */
    grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
    gap: 12px;
  }
  #sys-top-row {
    grid-column: 1;
    min-width: 0; /* else the unwrapped (white-space:pre) braille text's
                     intrinsic width blows out the grid track */
  }
  #sys-side {
    grid-column: 2;
  }
  .sys-side {
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-width: 0;
  }
  #sys-row2, #sys-row3 {
    grid-column: 1 / span 2;
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 12px;
    min-width: 0;
  }
  #sys-row2 > .sys-panel,
  #sys-row2 > .sys-side,
  #sys-row3 > .sys-panel,
  #sys-row3 > .sys-side {
    min-width: 0;
  }
  #sys-clock {
    /* only the 2fr column, same width as CPU/NET -- not the full row */
    grid-column: 1;
  }
  #clock-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 10px 4px;
    gap: 8px;
  }
  .clock-left {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 3px;
  }
  .clock-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 3px;
  }
  .clock-date {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.05em;
    white-space: nowrap;
  }
  .weather-main {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .weather-icon {
    display: flex;
    color: #33ff66;
    filter: drop-shadow(0 0 2px #33ff66) drop-shadow(0 0 5px rgba(51, 255, 102, 0.6));
  }
  .weather-icon svg {
    width: 20px;
    height: 20px;
    display: block;
  }
  .weather-sub {
    font-size: 10px;
    color: var(--muted);
    white-space: nowrap;
  }
  #sys-tailscale-side {
    grid-column: 2;
  }
  #sys-tailscale {
    /* .sys-side (the wrapper) gets stretched to match the clock's row
       height by the grid, same as always -- but with only one panel
       inside it, that panel itself still just sat at its own natural
       height, leaving an invisible gap below it instead of filling the
       wrapper (MEM/DISK and meshtastic/pihole never showed this because
       two stacked panels + gap happen to come close to the row height
       on their own). */
    flex: 1;
  }
  #sys-docker {
    /* same fix as #sys-tailscale above -- PROCESSUS is tall enough now
       (10 rows) that LOG+DOCKER's natural height falls short of the
       stretched .sys-side wrapper, leaving a gap below DOCKER instead of
       DOCKER itself reaching the bottom. Stretching it on purpose here
       (even with room to spare) so future containers have somewhere to
       land without the panel needing to grow again. */
    flex: 1;
  }
  #tailscale-devices, #docker-containers {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-top: 2px;
  }
  .tailscale-device {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 9px;
    color: var(--muted);
  }
  .tailscale-device .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  .tailscale-device.online .dot {
    background: #37e8b0;
    box-shadow: 0 0 4px #37e8b0;
  }
  .tailscale-device .name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #process-list {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-top: 2px;
  }
  .process-row {
    display: grid;
    grid-template-columns: 1fr 44px 64px 52px;
    align-items: baseline;
    gap: 10px;
    font-size: 10px;
    color: var(--muted);
  }
  .process-row .name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .process-row .pid, .process-row .mem, .process-row .pct {
    text-align: right;
  }
  .process-row .pct {
    color: var(--text);
  }
  .process-header {
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-size: 8px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    padding-bottom: 4px;
    margin-bottom: 2px;
  }
  #log-entries {
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin-top: 2px;
  }
  .log-row {
    display: flex;
    gap: 8px;
    font-size: 9px;
    color: var(--muted);
    overflow: hidden;
    white-space: nowrap;
  }
  .log-row .log-time {
    flex-shrink: 0;
    font-size: 7px;
    color: #ffd166;
  }
  .log-row .log-text {
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .clock-time, .clock-temp {
    color: #33ff66;
    text-shadow:
      0 0 2px #33ff66,
      0 0 6px rgba(51, 255, 102, 0.7),
      0 0 16px rgba(51, 255, 102, 0.4);
  }
  .clock-time {
    font-size: 28px;
    white-space: nowrap;
  }
  .clock-temp {
    font-size: 22px;
  }
  .sys-panel {
    border: 1px solid var(--border);
    border-radius: 6px;
    background: rgba(16, 22, 29, 0.6);
    padding: 10px 12px;
  }
  .sys-side .sys-panel {
    padding: 7px 9px;
  }
  .sys-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
    font-size: 11px;
    letter-spacing: 0.08em;
  }
  .sys-side .sys-header {
    font-size: 9px;
    margin-bottom: 4px;
  }
  .sys-label {
    font-weight: 600;
    text-transform: uppercase;
  }
  .sys-value {
    color: var(--text);
  }
  /* Same glow as the title/CPU ring, on request -- scoped to these four
     specifically (not the shared .sys-value class) so it doesn't leak
     onto mesh-status, which sets its own color in JS. */
  #mem-value, #disk-value, #pihole-value, #net-value, #uptime-value, #tailscale-value, #docker-value {
    color: #33ff66;
    text-shadow:
      0 0 2px #33ff66,
      0 0 6px rgba(51, 255, 102, 0.7),
      0 0 16px rgba(51, 255, 102, 0.4);
  }
  /* Real Meshtastic-app connection icons (router / router-with-slash),
     swapped in for the plain "online"/"offline" text -- see mesh-status
     usage in JS. Glow only applies when online, matching the Tailscale
     device dots (no glow on the offline/dim state). */
  #mesh-status {
    display: flex;
    align-items: center;
    align-self: center;
  }
  #mesh-status svg {
    width: 13px;
    height: 13px;
    display: block;
  }
  #mesh-status.online {
    filter: drop-shadow(0 0 2px #33ff66) drop-shadow(0 0 5px rgba(51, 255, 102, 0.6));
  }
  .sys-sub {
    margin-top: 4px;
    font-size: 10px;
    color: var(--muted);
  }
  .sys-side .sys-sub {
    font-size: 9px;
    margin-top: 3px;
  }
  .dot-bar {
    display: block;
    font-family: "BrailleSymbols", ui-monospace, monospace;
    font-size: 18px;
    line-height: 1;
    /* the glyph's own advance width leaves ~4px of blank bearing per cell
       beyond its dot pattern, which reads as gaps between characters --
       pull cells together so the dots line up like one continuous strip */
    letter-spacing: -3px;
    white-space: pre;
    overflow: hidden;
    text-shadow: 0 0 6px currentColor;
  }
  .sys-side .dot-bar {
    font-size: 14px;
  }
  .dot-bar .dot-track {
    opacity: 0.3;
    text-shadow: none;
  }
  #sys-pihole .dot-bar {
    margin-top: 4px;
  }
  .dot-bar .split-red {
    color: #ff5470;
    text-shadow: 0 0 6px currentColor;
  }
  .dot-bar .split-blue {
    color: #7ec8e3;
    text-shadow: 0 0 6px currentColor;
  }
  .sys-canvas {
    display: block;
    width: 100%;
    height: 56px;
  }
  #sys-meshtastic .sys-canvas {
    height: 28px;
  }
  /* NET's panel gets stretched to match the taller meshtastic+pihole
     column next to it, but the canvas stayed a fixed 56px -- leaving the
     baseline stuck near the top with a dead gap below. Filling the
     panel's real height instead centers it naturally. */
  #sys-net {
    display: flex;
    flex-direction: column;
  }
  #sys-net .sys-canvas {
    /* stays the original 56px -- centered in the leftover space below the
       header via auto margins, not stretched to fill it */
    flex-shrink: 0;
    margin-top: auto;
    margin-bottom: auto;
  }

  /* --- CPU ring gauge + per-core/temp side bars ------------------------- */
  /* Grid, not flex: a fixed-width center column guarantees the ring sits
     at the exact horizontal center regardless of how wide the core-bars
     or temp block end up being, instead of "centered as a group" (which
     drifts off-center whenever the two sides aren't equal width). */
  .cpu-gauge-row {
    display: grid;
    /* minmax(0, 1fr), not bare 1fr: an frtrack's default min size is its
       content's min-content width, so the wider side (whichever one that
       is) would otherwise win a bigger share and push the ring off-center */
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center;
    column-gap: 10px;
    margin: 4px 0 2px;
    min-width: 0;
  }
  .cpu-ring-wrap {
    position: relative;
    width: 130px;
    height: 130px;
    flex-shrink: 0;
  }
  #cpu-ring {
    display: block;
    width: 100%;
    height: 100%;
  }
  .cpu-ring-value {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 600;
    color: #33ff66;
    text-shadow:
      0 0 2px #33ff66,
      0 0 6px rgba(51, 255, 102, 0.7),
      0 0 16px rgba(51, 255, 102, 0.4);
  }
  /* Real braille glyphs again, stacked vertically via literal \n (see
     dotsToFit/cellWidthPx for the same idea applied horizontally). Two
     things broke the earlier attempt at this: (1) a plain full/half/track
     split left the boundary character's dim rows fully blank -- fixed by
     always drawing the FULL 8-dot glyph and fading it between dim and lit
     with opacity instead of turning individual dots off; (2) line-height
     wasn't tuned to the glyph's real vertical extent, leaving visible
     gaps between rows -- fixed the same way the horizontal gap was fixed,
     by measuring the font and setting line-height to match exactly. */
  .cpu-core-bars {
    display: flex;
    gap: 3px;
    justify-self: end;
  }
  .cpu-core-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    width: 24px; /* fixed so a 1 vs 3-digit % never shifts the layout */
  }
  .cpu-core-pct, .cpu-core-label {
    font-size: 9px;
    color: var(--muted);
  }
  .cpu-temp-block {
    display: flex;
    align-items: center;
    gap: 16px;
    justify-self: start;
    /* C0-C3's bars sit centered in a fixed-width column, which insets
       them ~8.6px further from the ring than the temp bar's own edge --
       matched here so both bars are the same distance from the ring. */
    margin-left: 9px;
  }
  .cpu-temp-info {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 5px;
    /* no fixed width here (unlike .cpu-core-col): "XX.X°C" is always the
       same length on a Pi, so there's nothing to fluctuate -- a fixed
       width just forced the box wider than its content and pushed
       everything toward the panel's edge */
  }
  .cpu-temp-value {
    font-size: 17px;
    font-weight: 600;
    color: #33ff66;
    text-shadow:
      0 0 2px #33ff66,
      0 0 6px rgba(51, 255, 102, 0.7),
      0 0 16px rgba(51, 255, 102, 0.4);
  }
  .cpu-loadavg {
    font-size: 10px;
    color: var(--muted);
    line-height: 1.5;
    text-align: center;
  }
  .cpu-vbar {
    font-size: 14px;
    text-align: center;
    /* same footprint the canvas bars occupied -- fixed so rowsToFit() has
       a stable target to measure against instead of a circular "height
       depends on content that depends on height". */
    height: 104px;
    overflow: hidden;
    /* line-height is set per-element from JS (measured against the actual
       glyph metrics) so stacked rows touch with no seam -- this is only
       a fallback in case that hasn't run yet. */
    line-height: 1;
  }
  /* LCD/7-segment look for digit runs only (see digitize()) -- segments
     are wide, so it wants more breathing room than a normal digit does. */
  .dseg {
    font-family: "DSEG7Classic", ui-monospace, monospace;
    letter-spacing: 0.02em;
  }
  .dseg-dot {
    /* the "." glyph itself has zero advance width, so without this the
       digits on either side touch it with no gap at all */
    margin: 0 0.12em;
    font-size: 1.15em;
  }

  /* --- responsive: the primary display is a 7" panel run at 1024x600
     portrait -- i.e. a 600px-wide viewport -- and that kiosk layout must
     stay pixel-identical to the desktop one above. These breakpoints sit
     well below 600px on purpose, so they only ever fire for an actual
     phone browser (typically 360-430px wide portrait), never for the kiosk
     display or a normal desktop window. Below ~560px the two-column layout
     (#system-wrap, #sys-row2) doesn't have room for both columns side by
     side, and below ~480px the CPU module's ring+core-bars+temp row
     (fixed-width by design, so the ring stays centered -- see its own
     comment above) doesn't have room for all three side by side either.
     These stack things vertically instead rather than trying to shrink
     content that isn't meant to shrink. -------------------------------- */
  @media (max-width: 560px) {
    #system-wrap {
      grid-template-columns: 1fr;
    }
    #sys-side, #sys-tailscale-side {
      grid-column: 1;
    }
    #sys-row2, #sys-row3 {
      grid-column: 1;
      grid-template-columns: 1fr;
    }
  }
  @media (max-width: 480px) {
    body { padding: 8px; }
    h1 { font-size: 22px; }
    .cpu-gauge-row {
      grid-template-columns: 1fr;
      justify-items: center;
      row-gap: 10px;
    }
    .cpu-ring-wrap {
      order: -1;
      width: 110px;
      height: 110px;
    }
    .cpu-core-bars {
      justify-self: center;
    }
    .cpu-temp-block {
      justify-self: center;
      margin-left: 0;
    }
    #clock-row {
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .clock-left, .clock-right {
      align-items: center;
    }
    .clock-time { font-size: 24px; }
    .clock-temp { font-size: 18px; }
  }
</style>
</head>
<body>
  <div class="header-row">
    <div id="status" class="disconnected"></div>
    <h1>Spectrum</h1>
    <div id="header-signal">
      <span id="header-rssi-dot" class="header-rssi-dot"></span>
      <span id="header-rssi">—</span>
    </div>
  </div>
  <div id="empty">en attente de nodes…</div>
  <div id="scope-wrap">
    <canvas id="scope"></canvas>
  </div>

  <div id="system-wrap">
    <div class="sys-panel" id="sys-clock">
      <div id="clock-row">
        <div class="clock-left">
          <div class="clock-date" id="clock-date">—</div>
          <div class="dseg clock-time" id="clock-time">—</div>
        </div>
        <div class="clock-right">
          <div class="weather-main">
            <span class="weather-icon" id="weather-icon">—</span>
            <span class="dseg clock-temp" id="clock-temp">—</span>
          </div>
          <div class="weather-sub" id="weather-sub">—</div>
        </div>
      </div>
    </div>

    <div class="sys-side" id="sys-tailscale-side">
      <div class="sys-panel" id="sys-tailscale">
        <div class="sys-header">
          <span class="sys-label" style="color:#c792ff">TAILSCALE</span>
          <span class="sys-value" id="tailscale-value">—</span>
        </div>
        <div id="tailscale-devices"></div>
      </div>
    </div>

    <div class="sys-panel" id="sys-top-row">
      <div class="sys-header">
        <span class="sys-label" style="color:#37e8b0">CPU</span>
      </div>
      <div class="cpu-gauge-row">
        <div class="cpu-core-bars">
          <div class="cpu-core-col">
            <div class="cpu-core-pct" id="cpu-core-pct-0">—</div>
            <div class="dot-bar cpu-vbar" id="cpu-core-0"></div>
            <div class="cpu-core-label">C0</div>
          </div>
          <div class="cpu-core-col">
            <div class="cpu-core-pct" id="cpu-core-pct-1">—</div>
            <div class="dot-bar cpu-vbar" id="cpu-core-1"></div>
            <div class="cpu-core-label">C1</div>
          </div>
          <div class="cpu-core-col">
            <div class="cpu-core-pct" id="cpu-core-pct-2">—</div>
            <div class="dot-bar cpu-vbar" id="cpu-core-2"></div>
            <div class="cpu-core-label">C2</div>
          </div>
          <div class="cpu-core-col">
            <div class="cpu-core-pct" id="cpu-core-pct-3">—</div>
            <div class="dot-bar cpu-vbar" id="cpu-core-3"></div>
            <div class="cpu-core-label">C3</div>
          </div>
        </div>
        <div class="cpu-ring-wrap">
          <canvas id="cpu-ring"></canvas>
          <div class="cpu-ring-value" id="cpu-ring-value">—</div>
        </div>
        <div class="cpu-temp-block">
          <div class="dot-bar cpu-vbar" id="cpu-temp-bar"></div>
          <div class="cpu-temp-info">
            <div class="cpu-temp-value" id="cpu-temp-value">—</div>
            <div class="cpu-loadavg" id="cpu-loadavg">—</div>
          </div>
        </div>
      </div>
    </div>

    <div class="sys-side" id="sys-side">
      <div class="sys-panel" id="sys-mem">

          <span class="sys-value" id="mem-value">—</span>

        <div class="sys-header">

          <span class="sys-value" id="disk-value">—</span>

        <div class="dot-bar" id="disk-bar" style="color:#ffb84d"></div>

      <div class="sys-panel" id="sys-uptime">
        <div class="sys-header">

    <div id="sys-row2">
      <div class="sys-panel" id="sys-net">
        <div class="sys-header">

          <span class="sys-value" id="net-value">—</span>

        <canvas class="sys-canvas" id="net-graph"></canvas>

      <div class="sys-side" id="sys-net-side">
        <div class="sys-panel" id="sys-meshtastic">
          <div class="sys-header">
            <span class="sys-label" style="color:#67ea94">MESHTASTIC</span>
            <span class="sys-value" id="mesh-status">—</span>
          </div>
          <canvas class="sys-canvas" id="mesh-wave"></canvas>
          <div class="sys-sub" id="mesh-sub"></div>
        </div>

        <div class="sys-panel" id="sys-pihole">
          <div class="sys-header">
            <span class="sys-label" style="color:#ff5470">PI-HOLE</span>
            <span class="sys-value" id="pihole-value">—</span>
          </div>
          <div class="sys-sub" id="pihole-sub"></div>
          <div class="dot-bar" id="pihole-bar"></div>

    </div>

    <div id="sys-row3">
      <div class="sys-panel" id="sys-processes">
        <div class="sys-header">
          <span class="sys-label" style="color:#ff6ec7">PROCESSUS</span>
        </div>
        <div class="process-row process-header">
          <span class="name"></span>
          <span class="pid">PID</span>
          <span class="mem">MEM</span>
          <span class="pct">CPU</span>
        </div>
        <div id="process-list"></div>
      </div>

      <div class="sys-side" id="sys-row3-side">
        <div class="sys-panel" id="sys-log">
          <div class="sys-header">
            <span class="sys-label" style="color:#ffd166">LOG</span>
          </div>
          <div id="log-entries"></div>
        </div>

        <div class="sys-panel" id="sys-docker">
          <div class="sys-header">
            <span class="sys-label" style="color:#2496ed">DOCKER</span>
            <span class="sys-value" id="docker-value">—</span>
          </div>
          <div id="docker-containers"></div>
        </div>
      </div>
    </div>
  </div>

<script>
  // ---------------------------------------------------------------
  // Rendu façon oscilloscope : une trace par node qui défile dans le
  // temps, superposées sur le même graphe. Le signal est généré côté
  // client (phase + bruit + pics) à partir de `motion`/`presence` ;
  // le réseau ne fait que mettre à jour la cible, le défilement lui
  // tourne à la fréquence d'affichage pour rester fluide entre deux
  // paquets UDP.
  // ---------------------------------------------------------------

  const canvas = document.getElementById("scope");
  const ctx = canvas.getContext("2d");
  const statusEl = document.getElementById("status");
  const emptyEl = document.getElementById("empty");
  const headerRssiEl = document.getElementById("header-rssi");
  const headerRssiDotEl = document.getElementById("header-rssi-dot");

  // Shorter than before (was 320): that extra height existed to leave the
  // legend room to sit under the waves without overlapping them -- with
  // the legend gone (replaced by header-rssi), there's nothing left that
  // needs the space.
  const LOGICAL_W = 800, LOGICAL_H = 260;
  function resize() {
    // shadowBlur (bloom) est recalculé sur toute la surface en pixels
    // device à chaque stroke : on plafonne le dpr pour rester fluide
    // sur les écrans HiDPI plutôt que de payer un blur 3-4x plus cher.
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    canvas.width = LOGICAL_W * dpr;
    canvas.height = LOGICAL_H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener("resize", resize);

  const SAMPLE_COUNT = 300; // ~5s d'historique à 60fps
  const PALETTE = ["#9d6cff", "#37e8b0", "#ffb84d", "#ff5470", "#c792ff", "#f4f4a1"];
  const OFFSETS_PX = [0, -12, 12, -24, 24, -36]; // léger décalage vertical pour que les traces se croisent sans se superposer

  const BASE_FREQ = 0.45, FREQ_GAIN = 3.0; // Hz, idle -> agité (idle = vague régulière et visible)
  const BASE_AMP = 0.14, AMP_GAIN = 0.5; // fraction de la demi-hauteur
  const SPIKE_DURATION = 0.18; // s, "pic net" sur détection de présence

  const nodeRuntime = new Map();
  function getRuntime(nodeId) {
    if (nodeRuntime.has(nodeId)) return nodeRuntime.get(nodeId);
    const idx = (nodeId - 1 + PALETTE.length * 100) % PALETTE.length;
    const rt = {
      color: PALETTE[idx],
      offsetPx: OFFSETS_PX[idx % OFFSETS_PX.length],
      doubled: nodeId === 1, // mirror twin: crosses the primary line at every zero-crossing
      samples: new Array(SAMPLE_COUNT).fill(0),
      phase: Math.random() * Math.PI * 2,
      smoothedMotion: 0,
      targetMotion: 0,
      presence: false,
      rssi: null,
      stale: false,
      ageS: 0,
      nextSpikeAt: 0,
      spikeStart: -1,
      spikeAmp: 0,
    };
    nodeRuntime.set(nodeId, rt);
    return rt;
  }

  // Purely decorative traces -- never tied to a real node, always rendered
  // idle/offline-styled. Negative ids keep them out of range of real
  // node_ids so they're never touched by applySnapshot's cleanup pass.
  function addDecorativeLine(id, color, offsetPx) {
    nodeRuntime.set(id, {
      color,
      offsetPx,
      doubled: false,
      samples: new Array(SAMPLE_COUNT).fill(0),
      phase: Math.random() * Math.PI * 2,
      smoothedMotion: 0,
      targetMotion: 0,
      presence: false,
      rssi: null,
      stale: true,
      ageS: 0,
      nextSpikeAt: 0,
      spikeStart: -1,
      spikeAmp: 0,
    });
  }
  addDecorativeLine(-1, "#d8c8a0", -24); // beige
  addDecorativeLine(-2, "#7ec8e3", 24);  // soft sky blue
  addDecorativeLine(-3, "#3a5a52", -36); // dark muted pine, low-key

  function stepSignal(rt, dt, nowS) {
    rt.smoothedMotion += ((rt.stale ? 0 : rt.targetMotion) - rt.smoothedMotion) * Math.min(1, dt * 4);

    const freq = BASE_FREQ + rt.smoothedMotion * FREQ_GAIN;
    rt.phase += freq * dt * Math.PI * 2;
    const wave = Math.sin(rt.phase) * (BASE_AMP + rt.smoothedMotion * AMP_GAIN);

    if (rt.presence && !rt.stale && nowS >= rt.nextSpikeAt) {
      rt.spikeStart = nowS;
      rt.spikeAmp = 0.5 + rt.smoothedMotion * 0.5;
      const interval = Math.max(0.35, 1.6 - rt.smoothedMotion * 1.2);
      rt.nextSpikeAt = nowS + interval + Math.random() * 0.2;
    }
    let spike = 0;
    if (rt.spikeStart >= 0) {
      const frac = (nowS - rt.spikeStart) / SPIKE_DURATION;
      if (frac >= 1) {
        rt.spikeStart = -1;
      } else {
        spike = Math.sin(frac * Math.PI) * rt.spikeAmp;
      }
    }

    const value = Math.max(-1, Math.min(1, wave + spike));
    rt.samples.push(value);
    rt.samples.shift();
  }

  function clearFrame() {
    // le quadrillage est le fond de page (CSS) ; le canvas reste transparent
    ctx.clearRect(0, 0, LOGICAL_W, LOGICAL_H);
  }

  function buildTracePath(rt, mirrored) {
    const centerY = LOGICAL_H / 2 + rt.offsetPx;
    const halfHeight = LOGICAL_H / 2 - 30;
    const dx = LOGICAL_W / (SAMPLE_COUNT - 1);
    const sign = mirrored ? 1 : -1;
    const path = new Path2D();
    for (let i = 0; i < SAMPLE_COUNT; i++) {
      const x = i * dx;
      const y = centerY + sign * rt.samples[i] * halfHeight;
      if (i === 0) path.moveTo(x, y);
      else path.lineTo(x, y);
    }
    return path;
  }

  // bloom phosphore (même principe que le glow du titre : un halo sous un
  // trait net). shadowBlur est coûteux sur canvas -> une seule passe floue
  // (halo) + une passe nette sans blur, plutôt que 3 passes floutées.
  const BLOOM_PASSES = [
    { blur: 10, width: 1.6, alpha: 0.4 },
    { blur: 0, width: 1, alpha: 0.95 },
  ];

  const MIRROR_ALPHA = 0.26; // dims the doubled twin line so it doesn't compete with the primary
  const PRIMARY_WIDTH_MUL = 1.2; // node 1's own line only, not its mirror twin

  function drawTrace(rt) {
    const primaryWidthMul = rt.doubled ? PRIMARY_WIDTH_MUL : 1;
    const paths = [{ path: buildTracePath(rt, false), alpha: 1, widthMul: primaryWidthMul }];
    if (rt.doubled) paths.push({ path: buildTracePath(rt, true), alpha: MIRROR_ALPHA, widthMul: 1 });
    const staleFactor = rt.stale ? 0.3 : 1;

    ctx.save();
    ctx.strokeStyle = rt.color;
    ctx.shadowColor = rt.color;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    for (const { path, alpha, widthMul } of paths) {
      for (const pass of BLOOM_PASSES) {
        ctx.globalAlpha = pass.alpha * staleFactor * alpha;
        ctx.shadowBlur = pass.blur;
        ctx.lineWidth = pass.width * widthMul;
        ctx.stroke(path);
      }
    }
    ctx.restore();
  }

  let lastTs = performance.now();
  function frame(ts) {
    const dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    const nowS = ts / 1000;

    clearFrame();
    for (const rt of nodeRuntime.values()) {
      stepSignal(rt, dt, nowS);
      drawTrace(rt);
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function applySnapshot(nodes) {
    emptyEl.style.display = nodes.length ? "none" : "block";
    const seen = new Set();
    let headerRssi = null;
    let headerColor = null;
    for (const n of nodes) {
      seen.add(n.node_id);
      const rt = getRuntime(n.node_id);
      rt.targetMotion = n.motion;
      rt.presence = n.presence;
      rt.rssi = n.rssi;
      rt.stale = n.stale;
      rt.ageS = n.age_s;

      // One reading in the header instead of a per-node legend row: the
      // first online node's signal strength (and its trace color, in the
      // dot), since in practice only one is ever actually connected at a
      // time.
      if (!n.stale && n.rssi !== null && headerRssi === null) {
        headerRssi = n.rssi;
        headerColor = rt.color;
      }
    }
    headerRssiEl.textContent = headerRssi === null ? "—" : `${headerRssi}dBm`;
    headerRssiDotEl.style.background = headerColor ?? "var(--muted)";
    for (const nodeId of nodeRuntime.keys()) {
      if (nodeId > 0 && !seen.has(nodeId)) {
        nodeRuntime.delete(nodeId);
      }
    }
  }

  // --- system monitor: CPU/RAM/disk/net, refreshed ~1x/s by the server,
  // rendered event-driven (no need to ride the 60fps oscilloscope loop). ---
  const SYS_HISTORY_LEN = 90;
  const netGraph = document.getElementById("net-graph");
  const cpuRingCanvas = document.getElementById("cpu-ring");
  const cpuRingValueEl = document.getElementById("cpu-ring-value");
  const cpuCoreBarEls = [0, 1, 2, 3].map((i) => document.getElementById(`cpu-core-${i}`));
  const cpuCorePctEls = [0, 1, 2, 3].map((i) => document.getElementById(`cpu-core-pct-${i}`));
  const cpuTempBarEl = document.getElementById("cpu-temp-bar");
  const cpuTempValueEl = document.getElementById("cpu-temp-value");
  const cpuLoadavgEl = document.getElementById("cpu-loadavg");
  const memValueEl = document.getElementById("mem-value");
  const memBarEl = document.getElementById("mem-bar");
  const memSubEl = document.getElementById("mem-sub");
  const diskValueEl = document.getElementById("disk-value");
  const diskBarEl = document.getElementById("disk-bar");
  const diskSubEl = document.getElementById("disk-sub");
  const uptimeValueEl = document.getElementById("uptime-value");
  const netValueEl = document.getElementById("net-value");
  const piholeValueEl = document.getElementById("pihole-value");
  const piholeSubEl = document.getElementById("pihole-sub");
  const piholeBarEl = document.getElementById("pihole-bar");
  const meshWaveCanvas = document.getElementById("mesh-wave");
  const meshStatusEl = document.getElementById("mesh-status");
  const meshSubEl = document.getElementById("mesh-sub");
  const processListEl = document.getElementById("process-list");
  const dockerValueEl = document.getElementById("docker-value");
  const dockerContainersEl = document.getElementById("docker-containers");
  const logEntriesEl = document.getElementById("log-entries");

  const netRxHistory = new Array(SYS_HISTORY_LEN).fill(0);
  const netTxHistory = new Array(SYS_HISTORY_LEN).fill(0);

  function pushHistory(arr, value) {
    arr.push(value);
    arr.shift();
  }

  // Resizing a <canvas> element wipes its bitmap, so this only happens once
  // per draw call (not once per series) -- otherwise layering rx+tx on the
  // net graph would erase the first line before the second is drawn.
  function ensureSysCanvasSize(canvas) {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    const w = canvas.clientWidth || LOGICAL_W;
    const h = canvas.clientHeight || 56;
    const targetW = Math.round(w * dpr), targetH = Math.round(h * dpr);
    if (canvas.width !== targetW || canvas.height !== targetH) {
      canvas.width = targetW;
      canvas.height = targetH;
    }
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx, w, h };
  }

  // direction: 1 grows downward from the midline, -1 grows upward -- so
  // two series sharing one scale can sit mirrored either side of a center
  // line instead of stacking on top of each other from a shared bottom edge.
  function drawHistoryLayer(ctx, w, h, history, maxValue, color, fillAlpha, direction = 1) {
    const midY = h / 2;
    const dx = w / (history.length - 1);
    const scale = maxValue > 0 ? (midY - 2) / maxValue : 0;

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(0, midY);
    for (let i = 0; i < history.length; i++) {
      ctx.lineTo(i * dx, midY + direction * history[i] * scale);
    }
    ctx.lineTo(w, midY);
    ctx.closePath();
    ctx.clip();

    // Braille dot-matrix fill instead of a flat alpha wash, matching the
    // MEM/DISK/PIHOLE bars' look elsewhere. A single pre-rendered tile
    // repeated via a canvas pattern, not fillText() in a double loop --
    // that was redrawing ~600 glyphs per layer, twice a broadcast tick
    // (5/s), and the font rasterization cost of that made the whole page
    // stutter. One fillRect() with a cached pattern costs nothing by
    // comparison.
    ctx.globalAlpha = fillAlpha;
    ctx.fillStyle = getBrailleTile(color, 7);
    ctx.fillRect(0, 0, w, h);
    ctx.restore();

    ctx.beginPath();
    for (let i = 0; i < history.length; i++) {
      const x = i * dx;
      const y = midY + direction * history[i] * scale;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.3;
    ctx.lineJoin = "round";
    ctx.stroke();
  }

  // Braille-cell bar for the MEM/DISK meters: each cell is full (all 8
  // dots), half (left column only), or empty, giving 2x the resolution of
  // one dot per cell. The unfilled track is drawn as a single faint dot
  // per cell (dimmed via CSS) rather than left blank, so the bar reads as
  // a gauge of fixed length instead of just a loose dot cluster floating
  // in empty space.
  const BRAILLE_BASE = 0x2800;

  // dotBar/splitBar render a FIXED cell count at a FIXED font-size, so at
  // normal widths they just fit -- but on a narrower screen the panel
  // shrinks while the text doesn't, and overflow:hidden silently clips the
  // tail off (the right-hand end looked "smaller" than it should for
  // exactly this reason). Measure the real per-cell width via canvas
  // (letter-spacing isn't reflected by measureText, so it's added back by
  // hand) and size the bar to whatever actually fits the container.
  const DOT_LETTER_SPACING_PX = -3;
  const _measureCanvas = document.createElement("canvas");
  const _measureCtx = _measureCanvas.getContext("2d");
  function cellWidthPx(fontSizePx) {
    _measureCtx.font = `${fontSizePx}px BrailleSymbols`;
    return _measureCtx.measureText(String.fromCharCode(BRAILLE_BASE | 0xff)).width + DOT_LETTER_SPACING_PX;
  }
  function dotsToFit(el, fontSizePx) {
    const w = cellWidthPx(fontSizePx);
    return Math.max(6, Math.floor(el.clientWidth / w));
  }

  function dotBar(percent, totalDots) {
    const eighths = Math.max(0, Math.min(totalDots * 2, Math.round((percent / 100) * totalDots * 2)));
    const full = Math.floor(eighths / 2);
    const half = eighths % 2 === 1;
    const filled = String.fromCharCode(BRAILLE_BASE | 0xff).repeat(full)
      + (half ? String.fromCharCode(BRAILLE_BASE | 0x47) : "");
    const track = String.fromCharCode(BRAILLE_BASE | 0x40).repeat(totalDots - full - (half ? 1 : 0));
    return `<span class="dot-fill">${filled}</span><span class="dot-track">${track}</span>`;
  }

  // Two-tone bar for the Pi-hole meter: unlike dotBar this isn't a gauge
  // with an empty track, it's a fully-filled bar split at the blocked%
  // boundary, red up to there and blue after. Uses the middle two dot-rows
  // only (not all 4) for a flatter, slimmer bar than the CPU/MEM/DISK ones.
  function splitBar(percentRed, totalDots) {
    const CELL_BITS = 0x36;
    const ch = String.fromCharCode(BRAILLE_BASE | CELL_BITS);
    const redCells = Math.max(0, Math.min(totalDots, Math.round((percentRed / 100) * totalDots)));
    const red = ch.repeat(redCells);
    const blue = ch.repeat(totalDots - redCells);
    return `<span class="split-blue">${blue}</span><span class="split-red">${red}</span>`;
  }

  // Wraps digit runs (with an optional single decimal point) in the LCD
  // font, leaving everything else -- units, labels, punctuation the font
  // doesn't have (%, /, ,) -- in the normal font. Safe to run on strings
  // that already contain HTML (e.g. "...<br>...") since the regex only
  // ever matches digits.
  function digitize(str) {
    // ":" is included (DSEG7 has a real colon glyph) so a time like
    // "15:21:42" becomes one continuous LCD-styled run -- otherwise the
    // colon renders in the plain font, and the size/baseline mismatch
    // against the big digits either side reads as a gap or a stray wrap.
    return str.replace(/[\d:]+(\.\d+)?/g, (m) => {
      // DSEG7's "." glyph has a zero advance width -- it's meant to
      // overlay the previous digit's cell like a real LCD decimal point,
      // so "3.5" renders with no visual gap around it at all. Force one.
      const spaced = m.replace(/\./g, '<span class="dseg-dot">.</span>');
      return `<span class="dseg">${spaced}</span>`;
    });
  }

  // Clock ticks locally off the viewer's own system clock (no reason to
  // round-trip this through the server); the weather figure arrives over
  // the same websocket as everything else, refreshed every 15 minutes.
  const clockTimeEl = document.getElementById("clock-time");
  const clockDateEl = document.getElementById("clock-date");
  const clockTempEl = document.getElementById("clock-temp");
  const weatherIconEl = document.getElementById("weather-icon");
  const weatherSubEl = document.getElementById("weather-sub");
  function updateClock() {
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, "0");
    const mm = String(now.getMinutes()).padStart(2, "0");
    const ss = String(now.getSeconds()).padStart(2, "0");
    clockTimeEl.innerHTML = digitize(`${hh}:${mm}:${ss}`);
    const dateStr = now.toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" });
    clockDateEl.innerHTML = digitize(dateStr);
  }
  setInterval(updateClock, 1000);
  updateClock();

  // WMO weather codes (what Open-Meteo's "weather_code" field returns) --
  // https://open-meteo.com/en/docs, the table under "WMO Weather interpretation codes"
  // Thin-line icons (stroke=currentColor, no fill) instead of emoji -- so
  // they take the same green + glow treatment as the rest of the module
  // instead of rendering as flat, font-dependent colored pictures.
  const WEATHER_SVG_ATTRS = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
  const CLOUD_PATH = '<path d="M6.5 15h11a4 4 0 0 0 .5-7.97A6 6 0 0 0 5.5 8.1 4 4 0 0 0 6.5 15z"/>';
  const WEATHER_ICON_SVGS = {
    sun: `<svg ${WEATHER_SVG_ATTRS}>
      <circle cx="12" cy="12" r="4"/>
      <line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/>
      <line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/>
      <line x1="4.9" y1="4.9" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.1" y2="19.1"/>
      <line x1="4.9" y1="19.1" x2="6.3" y2="17.7"/><line x1="17.7" y1="6.3" x2="19.1" y2="4.9"/>
    </svg>`,
    partlyCloudy: `<svg ${WEATHER_SVG_ATTRS}>
      <circle cx="7.5" cy="7.5" r="2.5"/>
      <line x1="7.5" y1="2" x2="7.5" y2="3"/><line x1="2" y1="7.5" x2="3" y2="7.5"/>
      <line x1="3.8" y1="3.8" x2="4.5" y2="4.5"/>
      ${CLOUD_PATH}
    </svg>`,
    cloudy: `<svg ${WEATHER_SVG_ATTRS}>${CLOUD_PATH}</svg>`,
    fog: `<svg ${WEATHER_SVG_ATTRS}>
      <path d="M5 8h11a4 4 0 0 0 .3-8"/>
      <line x1="3" y1="14" x2="21" y2="14"/><line x1="5" y1="18" x2="19" y2="18"/>
    </svg>`,
    drizzle: `<svg ${WEATHER_SVG_ATTRS}>
      ${CLOUD_PATH}
      <line x1="9" y1="18" x2="8" y2="20"/><line x1="13" y1="18" x2="12" y2="20"/><line x1="17" y1="18" x2="16" y2="20"/>
    </svg>`,
    rain: `<svg ${WEATHER_SVG_ATTRS}>
      ${CLOUD_PATH}
      <line x1="8" y1="18" x2="7" y2="22"/><line x1="12" y1="18" x2="11" y2="22"/><line x1="16" y1="18" x2="15" y2="22"/>
    </svg>`,
    snow: `<svg ${WEATHER_SVG_ATTRS}>
      ${CLOUD_PATH}
      <line x1="8" y1="18" x2="8" y2="18.01"/><line x1="12" y1="19" x2="12" y2="19.01"/><line x1="16" y1="18" x2="16" y2="18.01"/>

  // lerped across two segments so the ring drifts smoothly with load
  // instead of jumping between three fixed colors.
  const CPU_RING_STOPS = [
    [0.55, 0.91, 0.69],   // #37e8b0 at 0%
    [1.0, 0.72, 0.30],    // #ffb84d at 50%
    [1.0, 0.33, 0.44],    // #ff5470 at 100%

    const t = Math.max(0, Math.min(1, frac)) * 2;
    const i = Math.min(1, Math.floor(t));
    const localT = t - i;
    const [r0, g0, b0] = CPU_RING_STOPS[i];
    const [r1, g1, b1] = CPU_RING_STOPS[i + 1];
    const lerp = (a, b) => Math.round((a + (b - a) * localT) * 255);

  // exists) -- fixed by always drawing the FULL 8-dot glyph and fading it
  // between dim and lit with opacity, never turning individual dots off;
  // and untuned line-height left visible gaps between rows -- fixed by
  // measuring the glyph's real vertical extent (same idea as
  // cellWidthPx/dotsToFit horizontally) and setting line-height to match.

    if (pattern) return pattern;
    const cellW = cellWidthPx(fontSizePx);
    const cellH = vCellHeightPx(fontSizePx);
    const tile = document.createElement("canvas");
    tile.width = Math.ceil(cellW);
    tile.height = Math.ceil(cellH);
    const tctx = tile.getContext("2d");
    tctx.font = `${fontSizePx}px BrailleSymbols`;
    tctx.textBaseline = "top";
    tctx.fillStyle = color;
    tctx.fillText(BRAILLE_VFULL, 0, 0);
    pattern = _measureCtx.createPattern(tile, "repeat");

    // early it'd tile a fallback-font glyph, and unlike the DOM dot-bars
    // (which just reflow once the font swaps in), a cached canvas tile
    // would never get the chance to self-correct.

  const CPU_RING_CYCLES_HIGH = 40;

  const CPU_RING_HIGH_AMP = 8.5;
  const CPU_RING_LOW_AMP = 1.5;

  // whole ring's amplitude eases between its current strength and a
  // softer version of itself, on a loop.
  let cpuRingBreathPhase = Math.random() * Math.PI * 2;

    cpuRingPhase += 0.05;
    cpuRingPulsePhase += 0.062;
    cpuRingBreathPhase += 0.021;

    const ampBreath = 1.0 + 0.5 * Math.sin(cpuRingBreathPhase); // 0.5x soft floor .. 1.5x peak

    ctx.clearRect(0, 0, w, h);

    const cx = w / 2, cy = h / 2;
    const baseR = Math.min(w, h) / 2 - 14; // room for the strong wave's excursion + glow

    const path = new Path2D();
    for (let i = 0; i < CPU_RING_POINTS; i++) {

      const angle = -Math.PI / 2 + t * Math.PI * 2; // start at 12, sweep clockwise
      const loaded = t < cpuRingFrac;
      const amp = (loaded ? CPU_RING_HIGH_AMP : CPU_RING_LOW_AMP) * ampBreath;
      const cycles = loaded ? CPU_RING_CYCLES_HIGH : CPU_RING_CYCLES_LOW;
      const r = baseR + Math.sin(t * Math.PI * 2 * cycles + cpuRingPhase) * amp;
      const x = cx + Math.cos(angle) * r;
      const y = cy + Math.sin(angle) * r;
      if (i === 0) path.moveTo(x, y);

    ctx.lineJoin = "round";

      ctx.shadowBlur = pass.blur;
      ctx.lineWidth = pass.width * widthPulse;

  // Purely decorative -- not driven by real waveform data, just eases its
  // amplitude toward 1 when the mesh link is up and 0 when it's down, so it
  // settles into a flat line rather than snapping instantly on transitions.
  // BLOOM_PASSES' widths (1.6/1) read as thick inside this 28px-tall panel
  // even though they're the same absolute pixel width as the main scope --
  // a thinner stroke here to match how fine that one looks.
  const MESH_BLOOM_PASSES = [
    { blur: 3, width: 0.5, alpha: 0.35 },
    { blur: 0, width: 0.3, alpha: 0.9 },
  ];
  let meshOnline = false;
  let meshPhase = Math.random() * Math.PI * 2;
  let meshAmp = 0;
  // Slow global amplitude modulation on top of the base wave -- a ~5s sine,
  // not a spike -- so the whole trace gently swells and settles like a
  // breath instead of oscillating at one constant size forever.
  let meshBreathPhase = Math.random() * Math.PI * 2;
  function meshWaveFrame() {
    const { ctx, w, h } = ensureSysCanvasSize(meshWaveCanvas);
    ctx.clearRect(0, 0, w, h);

    meshAmp += ((meshOnline ? 1 : 0) - meshAmp) * 0.02;
    meshPhase += 0.06;
    meshBreathPhase += 0.021;
    const breath = 0.75 + 0.25 * Math.sin(meshBreathPhase);
    const midY = h / 2;
    const halfH = (h / 2 - 4) * meshAmp * breath;

    const path = new Path2D();
    const steps = 80;
    for (let i = 0; i <= steps; i++) {
      const x = (i / steps) * w;
      const y = midY + Math.sin(meshPhase + i * 0.35) * halfH;
      if (i === 0) path.moveTo(x, y);
      else path.lineTo(x, y);
    }

    ctx.save();
    ctx.strokeStyle = "#67ea94";
    ctx.shadowColor = "#67ea94";
    for (const pass of MESH_BLOOM_PASSES) {
      ctx.globalAlpha = pass.alpha;
      ctx.shadowBlur = pass.blur;
      ctx.lineWidth = pass.width;
      ctx.stroke(path);
    }
    ctx.restore();

    requestAnimationFrame(meshWaveFrame);
  }
  requestAnimationFrame(meshWaveFrame);

  function connect() {
    const ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onopen = () => {
      statusEl.className = "connected";
    };
    ws.onclose = () => {
      statusEl.className = "disconnected";
      setTimeout(connect, 1000);
    };
    ws.onerror = () => ws.close();
    ws.onmessage = (event) => {
      const payload = JSON.parse(event.data);
      applySnapshot(payload.nodes || []);
      updateSystem(payload.system);
      updatePihole(payload.pihole);
      updateMeshtastic(payload.meshtastic);
      updateWeather(payload.weather);
      updateTailscale(payload.tailscale);
      updateProcesses(payload.processes);
      updateDocker(payload.docker);
      updateLog(payload.log);
    };
  }

  connect();
</script>
</body>
</html>
